---
- name: Prepare infrastructure
  hosts: all
  become: yes
  tags: prepare
  pre_tasks:
    - name: Enable universe repository
      ansible.builtin.apt_repository:
        repo: universe
        state: present
  roles:
    - geerlingguy.pip
    - geerlingguy.docker

- name: Deploy application
  hosts: webservers
  become: yes
  tags: deploy
  roles:
    - redmine

- name: Setup monitoring
  hosts: webservers
  become: yes
  tags: monitoring
  roles:
    - datadog.datadog