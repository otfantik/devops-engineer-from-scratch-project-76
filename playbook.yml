---
- name: Prepare infrastructure
  hosts: all
  become: yes
  tags: prepare
  pre_tasks:
    - name: Ensure software-properties-common is installed
      ansible.builtin.apt:
        name: software-properties-common
        state: present
        update_cache: yes

    - name: Enable universe repository
      ansible.builtin.command: add-apt-repository -y universe
      args:
        creates: /etc/apt/sources.list.d/ubuntu-universe.list
  roles:
    - geerlingguy.pip
    - geerlingguy.docker

- name: Deploy application
  hosts: webservers
  become: yes
  tags: deploy
  roles:
    - redmine

- name: Setup monitoring
  hosts: webservers
  become: yes
  tags: monitoring
  roles:
    - datadog.datadog